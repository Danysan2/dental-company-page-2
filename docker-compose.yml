version: '3.8'

services:
  app:
    build:
      context: .
      args:
        DATABASE_URL: ${DATABASE_URL}
        NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${NEXT_PUBLIC_EMAILJS_SERVICE_ID}
        NEXT_PUBLIC_EMAILJS_TEMPLATE_PACIENTE: ${NEXT_PUBLIC_EMAILJS_TEMPLATE_PACIENTE}
        NEXT_PUBLIC_EMAILJS_TEMPLATE_CLINICA: ${NEXT_PUBLIC_EMAILJS_TEMPLATE_CLINICA}
        NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${NEXT_PUBLIC_EMAILJS_PUBLIC_KEY}
        NEXT_PUBLIC_CLINICA_EMAIL: ${NEXT_PUBLIC_CLINICA_EMAIL}
        JWT_SECRET: ${JWT_SECRET}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${NEXT_PUBLIC_EMAILJS_SERVICE_ID}
      NEXT_PUBLIC_EMAILJS_TEMPLATE_PACIENTE: ${NEXT_PUBLIC_EMAILJS_TEMPLATE_PACIENTE}
      NEXT_PUBLIC_EMAILJS_TEMPLATE_CLINICA: ${NEXT_PUBLIC_EMAILJS_TEMPLATE_CLINICA}
      NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${NEXT_PUBLIC_EMAILJS_PUBLIC_KEY}
      NEXT_PUBLIC_CLINICA_EMAIL: ${NEXT_PUBLIC_CLINICA_EMAIL}
    networks:
      - dokploy-network
    ports:
      - "3000:3000"
    restart: unless-stopped
networks:
  dokploy-network:
    external: true
